name: Keep Render backend awake

on:
  schedule:
    # Render's free tier spins down after 15 minutes idle; ping well inside that window.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://beshbolalavash-crm.onrender.com/api/health)
          echo "Response: $code"
          if [ "$code" != "200" ]; then
            echo "::warning::Health check returned $code instead of 200"
          fi
